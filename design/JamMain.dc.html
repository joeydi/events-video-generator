<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff4fa3","options":["#ff4fa3","#ff8a3d","#2fe0c0","#3aa8ff","#a77bff"]},"headlineStyle":{"editor":"enum","default":"extrude","options":["extrude","glow","flat"]},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
const accent = this.props.accent ?? '#ff4fa3';
const style = this.props.headlineStyle ?? 'extrude';
let shadow = '0 6px 30px rgba(14,16,44,0.8)';
if (style === 'extrude') {
const steps = [];
for (let i = 1; i <= 12; i++) steps.push(i + 'px ' + i + 'px 0 ' + accent);
steps.push('18px 22px 36px rgba(10,10,40,0.7)');
shadow = steps.join(', ');
}
if (style === 'glow') shadow = '0 4px 0 rgba(14,16,44,0.5), 0 0 40px ' + accent + '99, 0 0 120px ' + accent + '66';
return { accent: accent, shadow: shadow };
}
}
</script>
