<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Variations — Admin</title>
<link rel="stylesheet" href="/src/admin.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <strong>Event Variations</strong>
    <span class="muted" id="summary">loading…</span>
  </div>
  <div class="render-actions">
    <button id="render1" class="primary">Render 1080p</button>
    <button id="render2">Render 4K</button>
  </div>
</header>

<main class="layout">
  <section class="player">
    <div class="viewport" id="viewport"><div id="stage"></div></div>

    <div class="transport">
      <button id="play" class="icon" aria-label="Play / pause (space)">
        <svg viewBox="0 0 24 24" width="18" height="18" class="i-play"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 24" width="18" height="18" class="i-pause"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
      </button>
      <button id="prev" class="icon" aria-label="Previous frame (←)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button id="next" class="icon" aria-label="Next frame (→)">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <div class="readout"><span id="time">0.00s</span><span class="muted" id="frame">f 0 / 0</span></div>
      <label class="inline">Speed
        <select id="speed">
          <option value="0.1">0.1×</option>
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
        </select>
      </label>
      <label class="inline"><input type="checkbox" id="loop" checked> Loop</label>
      <span class="muted state-name" id="stateName"></span>
    </div>

    <div class="timeline">
      <div class="segments" id="segments"></div>
      <input type="range" id="scrub" min="0" max="179" step="1" value="0" aria-label="Scrub">
    </div>

    <div class="review" id="review" hidden>
      <div class="review-head">
        <strong>Latest render</strong>
        <span class="muted" id="reviewMeta"></span>
        <a id="download" download>Download</a>
      </div>
      <video id="reviewVideo" controls loop muted playsinline></video>
    </div>
  </section>

  <aside class="panel">
    <section>
      <h2>Variations</h2>
      <div class="grid" id="grid"></div>
    </section>

    <section>
      <h2>Review overlays</h2>
      <label class="row"><input type="checkbox" data-overlay="ref"> Design reference <kbd>R</kbd></label>
      <label class="row"><input type="checkbox" data-overlay="roles"> Morph targets <kbd>B</kbd></label>
      <label class="row"><input type="checkbox" data-overlay="guides"> Safe areas <kbd>G</kbd></label>
    </section>

    <section>
      <h2>Timing</h2>
      <div id="timing"></div>
      <div class="buttons">
        <button id="save">Save</button>
        <button id="revert">Revert</button>
        <span class="muted" id="dirty"></span>
      </div>
    </section>

    <section>
      <h2>Render log</h2>
      <div class="progress"><div id="progress"></div></div>
      <pre id="log" class="log">Idle.</pre>
    </section>
  </aside>
</main>

<script type="module" src="/src/admin.js"></script>
</body>
</html>
